<!DOCTYPE html>
<html>
<head>
  <title class="text">BMI Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div>
  <h2>BMI Calculator</h2>
  <p>This is a website that calculates your Body Mass Index, which uses a persons height and weight to estimate their total body fat and shows if you are at a healthy weight. It can be inacurate because it only compares height to weight, and a lot of other variables are dismissed.</p>
  
  <div class="inputs-row">
  <input type="text" id="feet" placeholder="Feet">
  <input type="text" id="inches" placeholder="Inches">
  <input type="text" id="weight" placeholder="Weight (lbs)">
  </div>

  <p id="result"></p>
</div>

<script src="script.js"></script>
</body>
</html>
