<!--
CHANGES MADE:
- Full-page layout instead of tiny centered box
- Large header section
- More spread out / modern UI
- Floating background blobs
- Animated particle effects when correct
- Pill bottle, capsule, and vaccine emoji particles
- Smooth animations
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real or Fake Medicine?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', sans-serif;
}

body{
  background:linear-gradient(135deg,#ffffff,#faf5ff,#f3e8ff);
  min-height:100vh;
  overflow:hidden;
  color:#3b0764;
  position:relative;
}

/* ======================================
BACKGROUND BLOBS
====================================== */

.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:0.25;
  z-index:0;
}

.blob1{
  width:400px;
  height:400px;
  background:#c084fc;
  top:-100px;
  left:-100px;
}

.blob2{
  width:350px;
  height:350px;
  background:#9333ea;
  bottom:-100px;
  right:-100px;
}

.blob3{
  width:250px;
  height:250px;
  background:#d8b4fe;
  top:40%;
  left:50%;
  transform:translateX(-50%);
}

/* ======================================
HEADER
====================================== */

header{
  width:100%;
  padding:40px 60px;
  position:relative;
  z-index:2;
}

header h1{
  font-size:4rem;
  color:#6b21a8;
  margin-bottom:10px;
}

header p{
  font-size:1.2rem;
  color:#7e22ce;
}

/* ======================================
GAME AREA
====================================== */

.game-area{
  position:relative;
  z-index:2;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px;
}

.game-card{
  width:100%;
  max-width:1000px;
  min-height:500px;

  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(12px);

  border:3px solid #d8b4fe;
  border-radius:30px;

  padding:60px;

  box-shadow:
    0 20px 60px rgba(147,51,234,0.15);

  text-align:center;

  position:relative;
}

/* ======================================
SCORE
====================================== */

.score{
  font-size:2rem;
  font-weight:bold;
  color:#9333ea;
  margin-bottom:40px;
}

/* ======================================
MEDICINE NAME
====================================== */

.medicine{
  font-size:5rem;
  font-weight:900;
  margin:80px 0;
  min-height:120px;
  word-break:break-word;
  color:#2e1065;
  letter-spacing:2px;

  opacity:1;
  transform:translateY(0px) scale(1);

  transition:
    opacity 0.25s ease,
    transform 0.25s ease,
    filter 0.25s ease;

  filter:blur(0px);
}
.medicine.change-out{
  opacity:0;
  transform:translateY(-20px) scale(0.96);
  filter:blur(6px);
}

.medicine.change-in{
  opacity:1;
  transform:translateY(0px) scale(1);
  filter:blur(0px);
}

/* ======================================
BUTTONS
====================================== */

.buttons{
  display:flex;
  justify-content:center;
  gap:30px;
  flex-wrap:wrap;
}

button{
  border:none;
  padding:22px 50px;
  border-radius:18px;
  cursor:pointer;
  transition:0.2s;
  font-size:1.3rem;
  font-weight:bold;
}

button:hover{
  transform:translateY(-4px) scale(1.03);
}

.real-btn{
  background:#9333ea;
  color:white;
  box-shadow:0 10px 25px rgba(147,51,234,0.35);
}

.fake-btn{
  background:#c084fc;
  color:white;
  box-shadow:0 10px 25px rgba(192,132,252,0.35);
}

.restart{
  background:#6b21a8;
  color:white;
  margin-top:35px;
  display:none;
}

/* ======================================
MESSAGE
====================================== */

.message{
  margin-top:35px;
  min-height:50px;
  font-size:1.4rem;
  font-weight:bold;
}

.game-over{
  color:#dc2626;
  line-height:1.5;
}

/* ======================================
PARTICLES
====================================== */

.particle{
  position:absolute;
  font-size:2rem;
  pointer-events:none;
  animation:burst 1.5s forwards ease-out;
  z-index:100;
}
.capsule{
  position:fixed;
  width:70px;
  height:30px;

  border-radius:999px;

  z-index:9999;
  pointer-events:none;

  overflow:hidden;

  box-shadow:
    0 8px 20px rgba(0,0,0,0.2);

  transform-origin:center;
}

.capsule::before,
.capsule::after{
  content:"";
  position:absolute;
  top:0;
  width:50%;
  height:100%;
}

.capsule::before{
  left:0;
}

.capsule::after{
  right:0;
  background:white;
  opacity:0.25;
}

@keyframes burst{

  0%{
    opacity:1;
    transform:translate(0,0) scale(1);
  }

  100%{
    opacity:0;
    transform:
      translate(var(--x), var(--y))
      rotate(720deg)
      scale(0.3);
  }
}

/* ======================================
RESPONSIVE
====================================== */

@media(max-width:768px){

  header{
    padding:30px;
    text-align:center;
  }

  header h1{
    font-size:2.7rem;
  }

  .game-card{
    padding:35px 25px;
  }

  .medicine{
    font-size:2.7rem;
  }

  .score{
    font-size:1.5rem;
  }

  button{
    width:100%;
  }
}

</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<header>
  <h1>Real or Fake Medicine?</h1>

</header>

<div class="game-area">

  <div class="game-card">

    <div class="score">
      Score: <span id="score">0</span>
    </div>

    <div class="medicine" id="medicineName">
      Loading...
    </div>

    <div class="buttons">
      <button class="real-btn" onclick="guess(true)">
        REAL
      </button>

      <button class="fake-btn" onclick="guess(false)">
        FAKE
      </button>
    </div>

    <div class="message" id="message"></div>

    <button class="restart" id="restartBtn" onclick="restartGame()">
      Restart Game
    </button>

  </div>

</div>

<script>

// =====================================
// REAL MEDS

"Aspirin","Atenolol","Atomoxetine","Atorvastatin","Atovaquone","Azathioprine","Azelastine","Azithromycin","Baclofen","Beclomethasone",
"Benazepril","Benzonatate","Betamethasone","Bicalutamide","Bisacodyl","Bisoprolol","Brimonidine","Bromocriptine","Budesonide","Bumetanide",
"Bupropion","Buspirone","Calcitriol","Canagliflozin","Candesartan","Capecitabine","Carbamazepine","Carbidopa","Carisoprodol","Carvedilol",
"Cefdinir","Cefixime","Cefpodoxime","Ceftriaxone","Celecoxib","Cephalexin","Cetirizine","Chlordiazepoxide","Chlorhexidine","Chloroquine",
"Cholestyramine","Ciclopirox","Cilostazol","Cinacalcet","Ciprofloxacin","Citalopram","Clarithromycin","Clindamycin","Clobetasol","Clonazepam",

"Desmopressin","Desvenlafaxine","Dexamethasone","Dexlansoprazole","Dexmethylphenidate","Diazepam","Diclofenac","Dicyclomine","Digoxin","Diltiazem",
"Diphenhydramine","Dipyridamole","Divalproex","Donepezil","Dorzolamide","Doxazosin","Doxycycline","Dronabinol","Drospirenone","Dulaglutide",
"Duloxetine","Dupilumab","Edoxaban","Efavirenz","Eletriptan","Empagliflozin","Enalapril","Enoxaparin","Entacapone","Eplerenone",
"Ergocalciferol","Erlotinib","Escitalopram","Esomeprazole","Estradiol","Eszopiclone","Etanercept","Ethambutol","Ethinyl","Etodolac",
"Ezetimibe","Famciclovir","Famotidine","Fenofibrate","Fentanyl","Ferrous","Finasteride","Fluconazole","Fludrocortisone","Fluoxetine",
"Flutamide","Fluticasone","Fondaparinux","Formoterol","Fosinopril","Frovatriptan","Furosemide","Gabapentin","Galantamine","Gemfibrozil",
"Glimepiride","Glipizide","Glyburide","Golimumab","Guanfacine","Halobetasol","Haloperidol","Heparin","Hydralazine","Hydrochlorothiazide",
"Hydrocodone","Hydrocortisone","Hydromorphone","Hydroxychloroquine","Hydroxyzine","Ibuprofen","Icosapent","Ifosfamide","Imipramine","Indapamide",
"Insulin","Ipratropium","Irbesartan","Irinotecan","Isosorbide","Itraconazole","Ivabradine","Ivermectin","Ketoconazole","Ketorolac",

"Labetalol","Lacosamide","Lamotrigine","Lansoprazole","Leflunomide","Lenalidomide","Levetiracetam","Levocetirizine","Levofloxacin","Levothyroxine",
"Linaclotide","Linagliptin","Liraglutide","Lisdexamfetamine","Lisinopril","Lithium","Loperamide","Lorazepam","Losartan","Lovastatin",
"Lumateperone","Medroxyprogesterone","Melatonin","Meloxicam","Memantine","Meropenem","Mesalamine","Metformin","Methadone","Methimazole",
"Methocarbamol","Methotrexate","Methylphenidate","Metoclopramide","Metolazone","Metoprolol","Metronidazole","Midodrine","Minocycline","Mirtazapine",
"Misoprostol","Modafinil","Montelukast","Morphine","Moxifloxacin","Mupirocin","Mycophenolate","Nabumetone","Nadolol","Naloxone",
"Naltrexone","Naproxen","Naratriptan","Nebivolol","Nifedipine","Nitrofurantoin","Nitroglycerin","Nortriptyline","Nystatin","Olanzapine",
"Olmesartan","Ondansetron","Oseltamivir","Oxybutynin","Oxycodone","Ozempic","Paliperidone","Pantoprazole","Paroxetine","Pegfilgrastim",
"Penicillin","Perindopril","Phenazopyridine","Phentermine","Pioglitazone","Piroxicam","Pitavastatin","Pneumovax","Polyethylene","Posaconazole",
"Potassium","Pramipexole","Prasugrel","Pravastatin","Prazosin","Prednisone","Pregabalin","Primidone","Probenecid","Prochlorperazine",
"Progesterone","Promethazine","Propafenone","Propranolol","Quetiapine","Quinapril","Rabeprazole","Raloxifene","Ramelteon","Ranolazine",
"Rasagiline","Rifaximin","Rimegepant","Risperidone","Rivaroxaban","Rizatriptan","Rosuvastatin","Rotigotine","Ruxolitinib","Sacubitril",
"Scopolamine","Secukinumab","Semaglutide","Sertraline","Sevelamer","Sildenafil","Simvastatin","Sitagliptin","Solifenacin","Sorafenib",
"Sotalol","Spironolactone","Sulfasalazine","Sumatriptan","Tacrolimus","Tadalafil","Tamsulosin","Temazepam","Terazosin","Terbinafine",
"Testosterone","Tetracycline","Thalidomide","Theophylline","Ticagrelor","Tizanidine","Tolterodine","Topiramate","Torsemide","Tramadol",
"Trazodone","Triamcinolone","Trihexyphenidyl","Trimethoprim","Ubrogepant","Umeclidinium","Ustekinumab","Valacyclovir","Valsartan","Vancomycin",
"Venlafaxine","Verapamil","Vilazodone","Voriconazole","Warfarin","Xylometazoline","Zaleplon","Ziprasidone","Zolmitriptan","Zonisamide"
];

// =====================================
// FAKE MEDS
// =====================================

const prefixes = [
"Zy","Vel","Nor","Tri","Xan","Lum","Dex","Neo","Astra","Vira",
"Mira","Ketra","Cura","Omni","Nexa","Rela","Vexo","Zora","Cryo","Prax"
];

const middles = [
"lume","vex","dren","fira","mora","zetra","laxon","vira","nexa","cetra",
"zol","trex","vion","dara","phena","trixa","mune","cora","vexa","dorin"
];

const suffixes = [
"pril","mab","zine","drol","mycin","vex","tide","sone","line","xate",
"tril","dine","zol","fex","bar","vax","nium","trel","prox","cor"
];

function generateFakeMedicine(){

  const p = prefixes[Math.floor(Math.random()*prefixes.length)];
  const m = middles[Math.floor(Math.random()*middles.length)];
  const s = suffixes[Math.floor(Math.random()*suffixes.length)];

  return p + m + s;
}

const fakeMedicines = [];
const activeCapsules = [];

while(fakeMedicines.length < 500){

  const fake = generateFakeMedicine();

  if(!fakeMedicines.includes(fake)){
    fakeMedicines.push(fake);
  }
}

// =====================================
// GAME SETUP
// =====================================

const allMedicines = [];

realMedicines.forEach(name=>{
  allMedicines.push({
    name,
    real:true
  });
});

fakeMedicines.forEach(name=>{
  allMedicines.push({
    name,
    real:false
  });
});

let score = 0;
let currentMedicine;

const medicineEl = document.getElementById("medicineName");
const scoreEl = document.getElementById("score");
const messageEl = document.getElementById("message");
const restartBtn = document.getElementById("restartBtn");

// =====================================
// RANDOM MED
// =====================================

function nextRound(){

  medicineEl.classList.add("change-out");

  setTimeout(()=>{

    currentMedicine =
      allMedicines[
        Math.floor(Math.random()*allMedicines.length)
      ];

    medicineEl.textContent = currentMedicine.name;

    medicineEl.classList.remove("change-out");

    medicineEl.classList.add("change-in");

    setTimeout(()=>{
      medicineEl.classList.remove("change-in");
    },250);

  },250);
}

// =====================================
// PARTICLES
// =====================================

const particleIcons = ["💊","🧪","💉","🩺","🩹"];

function spawnParticles(){

  for(let i = 0; i < 20; i++){

    const particle = document.createElement("div");

    particle.className = "particle";

    particle.textContent =
      particleIcons[
        Math.floor(Math.random()*particleIcons.length)
      ];

    particle.style.left =
      (window.innerWidth / 2) + "px";

    particle.style.top =
      (window.innerHeight / 2) + "px";

    particle.style.setProperty(
      "--x",
      (Math.random()*800 - 400) + "px"
    );

    particle.style.setProperty(
      "--y",
      (Math.random()*600 - 300) + "px"
    );

    document.body.appendChild(particle);

    setTimeout(()=>{
      particle.remove();
    },1500);
  }
}
function spawnCapsule(){

  const capsule = document.createElement("div");

  capsule.className = "capsule";

  // Random colors
  const colors = [
    "#9333ea",
    "#c084fc",
    "#ec4899",
    "#8b5cf6",
    "#06b6d4",
    "#f43f5e",
    "#22c55e",
    "#f59e0b"
  ];

  const color1 =
    colors[Math.floor(Math.random()*colors.length)];

  const color2 =
    colors[Math.floor(Math.random()*colors.length)];

  capsule.style.background =
    `linear-gradient(to right, ${color1} 50%, ${color2} 50%)`;

  // Random spawn position
  let x = Math.random() * (window.innerWidth - 100);

  let y = -100;

  // Physics
  let velocityY = 0;
  let velocityX = (Math.random() - 0.5) * 6;

  let rotation = Math.random() * 360;
  let rotationSpeed = (Math.random() - 0.5) * 12;

  const gravity = 0.45;
  const floor = window.innerHeight - 40;

  capsule.style.left = x + "px";
  capsule.style.top = y + "px";

  document.body.appendChild(capsule);

  activeCapsules.push(capsule);

  function animate(){

    velocityY += gravity;

    y += velocityY;
    x += velocityX;

    rotation += rotationSpeed;

    // Bounce physics
    if(y > floor){

      y = floor;

      velocityY *= -0.55;

      // Stop tiny bouncing
      if(Math.abs(velocityY) < 1){
        velocityY = 0;
      }
    }

    // wall bounce
    if(x < 0 || x > window.innerWidth - 70){
      velocityX *= -1;
    }

    capsule.style.top = y + "px";
    capsule.style.left = x + "px";

    capsule.style.transform =
      `rotate(${rotation}deg)`;

    // Continue animation
    if(
      y < floor ||
      Math.abs(velocityY) > 0.2
    ){
      requestAnimationFrame(animate);
    }
  }

  animate();
}

// =====================================
// GUESS
// =====================================

function guess(choice){

  if(choice === currentMedicine.real){

    score++;

    scoreEl.textContent = score;

    messageEl.textContent = "Correct!";
    messageEl.style.color = "#16a34a";

    spawnParticles();
    spawnCapsule();

    setTimeout(()=>{
      nextRound();
    },300);

  } else {

    messageEl.innerHTML = `
      <div class="game-over">
        WRONG! "${currentMedicine.name}" was
        ${currentMedicine.real ? "REAL" : "FAKE"}.
        <br><br>
        Final Score: ${score}
        activeCapsules.forEach(c=>{ 
        c.remove();
});

activeCapsules.length = 0;
      </div>
    `;

    document.querySelector(".real-btn").disabled = true;
    document.querySelector(".fake-btn").disabled = true;

    restartBtn.style.display = "inline-block";
  }
}

// =====================================
// RESTART
// =====================================

function restartGame(){

  score = 0;

  scoreEl.textContent = score;

  restartBtn.style.display = "none";

  document.querySelector(".real-btn").disabled = false;
  document.querySelector(".fake-btn").disabled = false;

  nextRound();
}

nextRound();

</script>

</body>
</html>
