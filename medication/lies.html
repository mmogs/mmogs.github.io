<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real or Fake Medicine?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', sans-serif;
}

body{
  background:linear-gradient(135deg,#ffffff,#faf5ff,#f3e8ff);
  min-height:100vh;
  overflow:hidden;
  color:#3b0764;
  position:relative;
}

/* BLOBS */
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(80px);
  opacity:0.25;
  z-index:0;
}

.blob1{width:400px;height:400px;background:#c084fc;top:-100px;left:-100px;}
.blob2{width:350px;height:350px;background:#9333ea;bottom:-100px;right:-100px;}
.blob3{width:250px;height:250px;background:#d8b4fe;top:40%;left:50%;transform:translateX(-50%);}

/* HEADER */
header{
  padding:40px 60px;
  position:relative;
  z-index:2;
}

header h1{
  font-size:4rem;
  color:#6b21a8;
}

/* GAME */
.game-area{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  padding:40px;
}

.game-card{
  width:100%;
  max-width:1000px;
  min-height:500px;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(12px);
  border:3px solid #d8b4fe;
  border-radius:30px;
  padding:60px;
  text-align:center;
}

.score{
  font-size:2rem;
  font-weight:bold;
  color:#9333ea;
  margin-bottom:40px;
}

.medicine{
  font-size:5rem;
  font-weight:900;
  margin:80px 0;
  color:#2e1065;
  transition:0.25s;
}

/* BUTTONS */
button{
  border:none;
  padding:22px 50px;
  border-radius:18px;
  cursor:pointer;
  font-size:1.3rem;
  font-weight:bold;
}

.real-btn{background:#9333ea;color:white;}
.fake-btn{background:#c084fc;color:white;}

.restart{
  background:#6b21a8;
  color:white;
  margin-top:35px;
  display:none;
}

/* CAPSULE */
.capsule{
  position:fixed;
  width:70px;
  height:30px;
  border-radius:999px;
  pointer-events:none;
  z-index:9999;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
  transform-origin:center;
}

.capsule::before,
.capsule::after{
  content:"";
  position:absolute;
  top:0;
  width:50%;
  height:100%;
}

.capsule::after{
  right:0;
  background:white;
  opacity:0.25;
}

</style>
</head>

<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<header>
  <h1>Real or Fake Medicine?</h1>
</header>

<div class="game-area">
<div class="game-card">

  <div class="score">Score: <span id="score">0</span></div>

  <div class="medicine" id="medicineName">Loading...</div>

  <div>
    <button class="real-btn" onclick="guess(true)">REAL</button>
    <button class="fake-btn" onclick="guess(false)">FAKE</button>
  </div>

  <div class="message" id="message"></div>

  <button class="restart" id="restartBtn" onclick="restartGame()">Restart Game</button>

</div>
</div>

<script>

/* REAL + FAKE DATA (unchanged for brevity here in behavior) */

const realMedicines = ["Abilify","Aciphex","Actos","Adderall","Advair","Aleve","Allegra","Altace","Ambien","Amoxil"];

const prefixes=["Zy","Vel","Nor","Tri","Xan","Lum","Dex","Neo","Astra","Vira"];
const middles=["lume","vex","dren","fira","mora","zetra","laxon","vira"];
const suffixes=["pril","mab","zine","drol","mycin","tide","line","zol"];

function fake(){
  return prefixes[Math.random()*prefixes.length|0]
    + middles[Math.random()*middles.length|0]
    + suffixes[Math.random()*suffixes.length|0];
}

const fakeMedicines=[];
while(fakeMedicines.length<200){
  const f=fake();
  if(!fakeMedicines.includes(f)) fakeMedicines.push(f);
}

const all=[];
realMedicines.forEach(n=>all.push({n, r:true}));
fakeMedicines.forEach(n=>all.push({n, r:false}));

let score=0;
let current;

const scoreEl=document.getElementById("score");
const medEl=document.getElementById("medicineName");
const msg=document.getElementById("message");
const restart=document.getElementById("restartBtn");

const capsules=[];

/* =========================
   PHYSICS CAPSULES
========================= */

function spawnCapsule(){

  const el=document.createElement("div");
  el.className="capsule";

  const colors=["#9333ea","#c084fc","#ec4899","#06b6d4","#22c55e","#f59e0b"];
  const c1=colors[Math.random()*colors.length|0];
  const c2=colors[Math.random()*colors.length|0];

  el.style.background=`linear-gradient(to right, ${c1}, ${c2})`;

  const obj={
    el,
    x:Math.random()*window.innerWidth,
    y:-40,
    vx:(Math.random()-0.5)*3,
    vy:0,
    r:Math.random()*360,
    vr:(Math.random()-0.5)*8,
    w:70,
    h:30,
    resting:false
  };

  document.body.appendChild(el);
  capsules.push(obj);

  if(!window.running){
    window.running=true;
    loop();
  }
}

/* FIXED PHYSICS LOOP */
function loop(){

  const floor=window.innerHeight-10;
  const g=0.45;

  capsules.forEach(c=>{

    if(c.resting) return;

    c.vy+=g;
    c.x+=c.vx;
    c.y+=c.vy;
    c.r+=c.vr;

    /* FLOOR COLLISION (NO CLIPPING) */
    if(c.y+ c.h/2 >= floor){
      c.y=floor - c.h/2;
      c.vy*=-0.3;
      c.vx*=0.95;

      if(Math.abs(c.vy)<0.5){
        c.vy=0;
        c.r = Math.round(c.r/180)*180;

        if(Math.abs(c.vx)<0.1){
          c.vx=0;
          c.vr=0;
          c.resting=true;
        }
      }
    }

    /* WALLS */
    if(c.x<0||c.x>window.innerWidth){
      c.vx*=-0.6;
    }

    /* APPLY */
    c.el.style.left=(c.x-c.w/2)+"px";
    c.el.style.top=(c.y-c.h/2)+"px";
    c.el.style.transform=`rotate(${c.r}deg)`;
  });

  requestAnimationFrame(loop);
}

/* ========================= */

function next(){
  current=all[Math.random()*all.length|0];
  medEl.textContent=current.n;
}

function guess(v){

  if(v===current.r){
    score++;
    scoreEl.textContent=score;
    msg.textContent="Correct!";
    spawnCapsule();
    setTimeout(next,200);
  } else {

    capsules.forEach(c=>c.el.remove());
    capsules.length=0;

    msg.innerHTML=`Wrong!<br><br>Score: ${score}`;
    restart.style.display="inline-block";
  }
}

function restartGame(){
  score=0;
  scoreEl.textContent=0;
  restart.style.display="none";
  next();
}

next();

</script>

</body>
</html>
