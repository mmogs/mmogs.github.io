<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real or Fake Medicine?</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:linear-gradient(135deg,#ffffff,#f3e8ff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:#2e1065;
}

.game{
  width:100%;
  max-width:700px;
  background:white;
  border:4px solid #9333ea;
  border-radius:24px;
  padding:40px;
  text-align:center;
  box-shadow:0 15px 40px rgba(147,51,234,0.2);
}

h1{
  font-size:3rem;
  margin-bottom:10px;
  color:#6b21a8;
}

.subtitle{
  color:#7e22ce;
  margin-bottom:30px;
  font-size:1.1rem;
}

.score{
  font-size:1.5rem;
  margin-bottom:35px;
  color:#9333ea;
  font-weight:bold;
}

.medicine{
  font-size:3.2rem;
  font-weight:bold;
  margin:50px 0;
  min-height:80px;
  word-break:break-word;
  color:#3b0764;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap:wrap;
}

button{
  border:none;
  padding:16px 34px;
  font-size:1.2rem;
  font-weight:bold;
  border-radius:14px;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

.real-btn{
  background:#9333ea;
  color:white;
}

.fake-btn{
  background:#c084fc;
  color:white;
}

.restart{
  margin-top:30px;
  background:#6b21a8;
  color:white;
  display:none;
}

.message{
  margin-top:30px;
  font-size:1.2rem;
  min-height:40px;
}

.game-over{
  color:#dc2626;
  font-size:1.5rem;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="game">
  <h1>Real or Fake Medicine?</h1>

  <div class="subtitle">
    Guess whether the medication name is REAL or FAKE
  </div>

  <div class="score">
    Score: <span id="score">0</span>
  </div>

  <div class="medicine" id="medicineName">
    Loading...
  </div>

  <div class="buttons">
    <button class="real-btn" onclick="guess(true)">
      REAL
    </button>

    <button class="fake-btn" onclick="guess(false)">
      FAKE
    </button>
  </div>

  <div class="message" id="message"></div>

  <button class="restart" id="restartBtn" onclick="restartGame()">
    Restart Game
  </button>
</div>

"Venlafaxine","Verapamil","Vilazodone","Voriconazole","Warfarin","Xylometazoline","Zaleplon","Ziprasidone","Zolmitriptan","Zonisamide"
];

// =====================================
// FAKE MEDICINES
// =====================================

const prefixes = [
"Zy","Vel","Nor","Tri","Xan","Lum","Dex","Neo","Astra","Vira",
"Mira","Ketra","Cura","Omni","Nexa","Rela","Vexo","Zora","Cryo","Prax"
];

const middles = [
"lume","vex","dren","fira","mora","zetra","laxon","vira","nexa","cetra",
"zol","trex","vion","dara","phena","trixa","mune","cora","vexa","dorin"
];

const suffixes = [
"pril","mab","zine","drol","mycin","vex","tide","sone","line","xate",
"tril","dine","zol","fex","bar","vax","nium","trel","prox","cor"
];

function generateFakeMedicine(){
  const p = prefixes[Math.floor(Math.random()*prefixes.length)];
  const m = middles[Math.floor(Math.random()*middles.length)];
  const s = suffixes[Math.floor(Math.random()*suffixes.length)];

  return p + m + s;
}

const fakeMedicines = [];

while(fakeMedicines.length < 500){

  const fake = generateFakeMedicine();

  if(
    !fakeMedicines.includes(fake) &&
    !realMedicines.includes(fake)
  ){
    fakeMedicines.push(fake);
  }
}

// =====================================
// GAME SETUP
// =====================================

const allMedicines = [];

realMedicines.forEach(name=>{
  allMedicines.push({
    name:name,
    real:true
  });
});

fakeMedicines.forEach(name=>{
  allMedicines.push({
    name:name,
    real:false
  });
});

let score = 0;
let currentMedicine = null;
let usedNames = [];

const medicineEl = document.getElementById("medicineName");
const scoreEl = document.getElementById("score");
const messageEl = document.getElementById("message");
const restartBtn = document.getElementById("restartBtn");

function getRandomMedicine(){

  if(usedNames.length >= allMedicines.length){
    usedNames = [];
  }

  let med;

  do{
    med = allMedicines[
      Math.floor(Math.random()*allMedicines.length)
    ];
  }while(usedNames.includes(med.name));

  usedNames.push(med.name);

  return med;
}

function nextRound(){
  currentMedicine = getRandomMedicine();
  medicineEl.textContent = currentMedicine.name;
  messageEl.textContent = "";
}

function guess(choice){

  if(choice === currentMedicine.real){

    score++;
    scoreEl.textContent = score;

    messageEl.textContent = "Correct!";
    messageEl.style.color = "#16a34a";

    setTimeout(()=>{
      nextRound();
    },300);

  } else {

    messageEl.innerHTML = `
      <div class="game-over">
        WRONG! "${currentMedicine.name}" was
        ${currentMedicine.real ? "REAL" : "FAKE"}.
        <br><br>
        Final Score: ${score}
      </div>
    `;

    restartBtn.style.display = "inline-block";

    document.querySelector(".real-btn").disabled = true;
    document.querySelector(".fake-btn").disabled = true;
  }
}

function restartGame(){

  score = 0;
  scoreEl.textContent = score;

  restartBtn.style.display = "none";

  document.querySelector(".real-btn").disabled = false;
  document.querySelector(".fake-btn").disabled = false;

  nextRound();
}

nextRound();

</script>

</body>
</html>
