<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real or Fake Medicine?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', sans-serif;
}

body{
  background:linear-gradient(135deg,#ffffff,#faf5ff,#f3e8ff);
  min-height:100vh;
  overflow:hidden;
  color:#3b0764;
}

/* HEADER */
header{
  padding:40px 60px;
  z-index:2;
  position:relative;
}

header h1{
  font-size:4rem;
  color:#6b21a8;
}

/* GAME */
.game-area{
  display:flex;
  justify-content:center;
  padding:30px;
  position:relative;
  z-index:2;
}

.game-card{
  width:100%;
  max-width:1000px;
  min-height:500px;
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(12px);
  border:3px solid #d8b4fe;
  border-radius:30px;
  padding:60px;
  text-align:center;
}

.score{
  font-size:2rem;
  color:#9333ea;
  margin-bottom:40px;
  font-weight:bold;
}

.medicine{
  font-size:5rem;
  font-weight:900;
  margin:80px 0;
  color:#2e1065;
  transition:0.25s;
}

/* BUTTONS */
button{
  padding:20px 45px;
  font-size:1.2rem;
  font-weight:bold;
  border-radius:16px;
  border:none;
  cursor:pointer;
}

.real-btn{background:#9333ea;color:white;}
.fake-btn{background:#c084fc;color:white;}

.restart{
  background:#6b21a8;
  color:white;
  margin-top:30px;
  display:none;
}

/* CAPSULE */
.capsule{
  position:fixed;
  width:70px;
  height:30px;
  border-radius:999px;
  pointer-events:none;
  z-index:9999;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
  transform-origin:center;
}

/* PARTICLES */
.particle{
  position:absolute;
  font-size:2rem;
  pointer-events:none;
  animation:burst 1.3s forwards ease-out;
}

@keyframes burst{
  0%{opacity:1;transform:translate(0,0) scale(1);}
  100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0.3);}
}

</style>
</head>

<body>

<header>
  <h1>Real or Fake Medicine?</h1>
</header>

<div class="game-area">
<div class="game-card">

  <div class="score">Score: <span id="score">0</span></div>

  <div class="medicine" id="medicineName">Loading...</div>

  <div>
    <button class="real-btn" onclick="guess(true)">REAL</button>
    <button class="fake-btn" onclick="guess(false)">FAKE</button>
  </div>

  <div id="message"></div>

  <button class="restart" id="restartBtn" onclick="restartGame()">Restart</button>

</div>
</div>

<script>

/* =========================
   DATA
========================= */

const realMedicines = [
"Ibuprofen","Amoxicillin","Metformin","Lisinopril","Atorvastatin",
"Sertraline","Omeprazole","Amlodipine","Azithromycin","Gabapentin"
];

const prefixes=["Zy","Vel","Nor","Tri","Xan","Lum","Dex","Neo","Vira","Astra"];
const mids=["lume","vex","dren","mora","vira","cetra","zol","trex"];
const suf=["pril","mab","zine","mycin","drol","tide","line","zol"];

function fake(){
  return prefixes[Math.random()*prefixes.length|0]
    + mids[Math.random()*mids.length|0]
    + suf[Math.random()*suf.length|0];
}

const fakeMedicines=[];
while(fakeMedicines.length<200){
  const f=fake();
  if(!fakeMedicines.includes(f)) fakeMedicines.push(f);
}

const all=[];
realMedicines.forEach(n=>all.push({n, r:true}));
fakeMedicines.forEach(n=>all.push({n, r:false}));

/* =========================
   STATE
========================= */

let score=0;
let current;

const scoreEl=document.getElementById("score");
const med=document.getElementById("medicineName");
const msg=document.getElementById("message");
const restart=document.getElementById("restartBtn");

/* =========================
   PARTICLES
========================= */

function particles(){

  const icons=["💊","🧪","💉"];

  for(let i=0;i<18;i++){

    const p=document.createElement("div");
    p.className="particle";
    p.textContent=icons[Math.random()*icons.length|0];

    p.style.left="50%";
    p.style.top="50%";

    p.style.setProperty("--x",(Math.random()*600-300)+"px");
    p.style.setProperty("--y",(Math.random()*600-300)+"px");

    document.body.appendChild(p);

    setTimeout(()=>p.remove(),1300);
  }
}

/* =========================
   CAPSULE PHYSICS
========================= */

const caps=[];

function capsule(){

  const el=document.createElement("div");
  el.className="capsule";

  const c1=["#9333ea","#c084fc","#06b6d4","#22c55e","#f59e0b"][Math.random()*5|0];
  const c2=["#ec4899","#8b5cf6","#14b8a6","#84cc16","#f97316"][Math.random()*5|0];

  el.style.background=`linear-gradient(to right, ${c1}, ${c2})`;

  const obj={
    el,
    x:Math.random()*window.innerWidth,
    y:-50,
    vx:(Math.random()-0.5)*4,
    vy:0,
    r:Math.random()*360,
    vr:(Math.random()-0.5)*8,
    w:70,
    h:30,
    rest:false
  };

  caps.push(obj);
  document.body.appendChild(el);

  if(!window.run){
    window.run=true;
    loop();
  }
}

function loop(){

  const floor=window.innerHeight-10;
  const g=0.45;

  caps.forEach(c=>{

    if(c.rest) return;

    c.vy+=g;
    c.x+=c.vx;
    c.y+=c.vy;
    c.r+=c.vr;

    if(c.y+c.h/2>=floor){
      c.y=floor-c.h/2;
      c.vy*=-0.25;
      c.vx*=0.95;

      if(Math.abs(c.vy)<0.5){
        c.vy=0;

        if(Math.abs(c.vx)<0.1){
          c.vx=0;
          c.vr=0;
          c.rest=true;
        }
      }
    }

    c.el.style.left=(c.x-c.w/2)+"px";
    c.el.style.top=(c.y-c.h/2)+"px";
    c.el.style.transform=`rotate(${c.r}deg)`;
  });

  requestAnimationFrame(loop);
}

/* =========================
   GAME
========================= */

function next(){
  current=all[Math.random()*all.length|0];
  med.textContent=current.n;
}

function guess(v){

  if(v===current.r){

    score++;
    scoreEl.textContent=score;

    msg.textContent="Correct!";
    particles();
    capsule();

    next();

  } else {

    caps.forEach(c=>c.el.remove());
    caps.length=0;

    msg.innerHTML=`Wrong!<br>Score: ${score}`;
    restart.style.display="inline-block";
  }
}

function restartGame(){
  score=0;
  scoreEl.textContent=0;
  restart.style.display="none";
  next();
}

next();

</script>

</body>
</html>
