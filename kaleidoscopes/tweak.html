<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaleidoscope Camera</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }

    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 220px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label { display: flex; flex-direction: column; font-size: 14px; }
    input, select { margin-top: 5px; }
  </style>
</head>
<body>
<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas"></canvas>

<div class="sidebar">
  <label>
    Zoom
    <input id="zoom" type="range" min="1" max="3" step="0.1" value="1.5">
  </label>

  <label>
    Panes
    <input id="slices" type="range" min="4" max="24" step="1" value="12">
  </label>

  <label>
    Filter
    <select id="filter">
      <option value="none">None</option>
      <option value="grayscale(1)">Grayscale</option>
      <option value="sepia(1)">Sepia</option>
      <option value="invert(1)">Invert</option>
      <option value="contrast(2)">High Contrast</option>
      <option value="saturate(3)">Vivid</option>
      <option value="blur(3px)">Soft Blur</option>
      <option value="brightness(1.5)">Bright</option>
      <option value="hue-rotate(180deg)">Cool Shift</option>
      <option value="saturate(5) contrast(3)">Neon Pop</option>
      <option value="grayscale(1) contrast(2)">Film Noir</option>
      <option value="invert(1) hue-rotate(180deg)">Psychedelic</option>
    </select>
  </label>

  <label>
    Effect
    <select id="effect">
      <option value="none">None</option>
      <option value="fisheye">Fishbowl</option>
      <option value="stretch">Stretch</option>
      <option value="squish">Squish</option>
    </select>
  </label>

  <label>
    Disco Mode
    <input id="disco" type="checkbox">
  </label>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const zoomSlider = document.getElementById('zoom');
const sliceSlider = document.getElementById('slices');
const filterSelect = document.getElementById('filter');
const effectSelect = document.getElementById('effect');
const discoToggle = document.getElementById('disco');

let hue = 0;

let centerX = window.innerWidth / 2;
let centerY = window.innerHeight / 2;
let dragging = false;

canvas.addEventListener('mousedown', () => dragging = true);
canvas.addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('mouseleave', () => dragging = false);
canvas.addEventListener('mousemove', (e) => {
  if (dragging) {
    centerX = e.clientX;
    centerY = e.clientY;
  }
});

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    requestAnimationFrame(draw);
  })
  .catch(() => alert('Camera access denied'));

function getEffectScale() {
  const effect = effectSelect.value;
  if (effect === 'fisheye') {
    return { x: 1.2, y: 0.8 };
  } else if (effect === 'stretch') {
    return { x: 1.3, y: 1 };
  } else if (effect === 'squish') {
    return { x: 0.8, y: 1.2 };
  }
  return { x: 1, y: 1 };
} else if (effect === 'stretch') {
    ctx.scale(1.3, 1);
  } else if (effect === 'squish') {
    ctx.scale(0.8, 1.2);
  }
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  const size = Math.min(w, h);
  const zoom = parseFloat(zoomSlider.value);
  const slices = parseInt(sliceSlider.value);

  ctx.clearRect(0, 0, w, h);

  if (discoToggle.checked) {
    hue += 2;
    ctx.filter = `hue-rotate(${hue}deg) saturate(2)`;
  } else {
    ctx.filter = filterSelect.value;
  }

  const angle = (Math.PI * 2) / slices;
  const drawSize = size * zoom;

  for (let i = 0; i < slices; i++) {
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(i * angle);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, size / 2, -angle / 2, angle / 2);
    ctx.closePath();
    ctx.clip();

    if (i % 2 === 0) ctx.scale(1, -1);

    const effectScale = getEffectScale();

    const finalWidth = drawSize * effectScale.x;
    const finalHeight = drawSize * effectScale.y;

    ctx.drawImage(
      video,
      (video.videoWidth - size / zoom) / 2,
      (video.videoHeight - size / zoom) / 2,
      size / zoom,
      size / zoom,
      -finalWidth / 2,
      -finalHeight / 2,
      finalWidth,
      finalHeight
    );

    ctx.restore();
  }

  ctx.filter = 'none';

  requestAnimationFrame(draw);
}

window.addEventListener('resize', () => {
  resize();
  centerX = canvas.width / 2;
  centerY = canvas.height / 2;
});
</script>
</body>
</html>
