<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaleidoscope Camera</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 12px;
      color: white;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    input, select {
      cursor: pointer;
    }
  </style>
</head>
<body>
<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas"></canvas>

<div class="controls">
  <label>
    Zoom
    <input id="zoom" type="range" min="1" max="3" step="0.1" value="1.5">
  </label>

  <label>
    Filter
    <select id="filter">
      <option value="none">None</option>
      <option value="grayscale(1)">Grayscale</option>
      <option value="sepia(1)">Sepia</option>
      <option value="invert(1)">Invert</option>
      <option value="hue-rotate(90deg)">Hue Shift</option>
      <option value="contrast(2)">High Contrast</option>
      <option value="saturate(3)">Vivid</option>
    </select>
  </label>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const zoomSlider = document.getElementById('zoom');
const filterSelect = document.getElementById('filter');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    requestAnimationFrame(draw);
  })
  .catch(() => alert('Camera access denied'));

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  const size = Math.min(w, h);
  const zoom = parseFloat(zoomSlider.value);

  ctx.clearRect(0, 0, w, h);

  ctx.filter = filterSelect.value;

  const slices = 12;
  const angle = (Math.PI * 2) / slices;

  const drawSize = size * zoom;

  for (let i = 0; i < slices; i++) {
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(i * angle);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, size / 2, -angle / 2, angle / 2);
    ctx.closePath();
    ctx.clip();

    if (i % 2 === 0) {
      ctx.scale(1, -1);
    }

    ctx.drawImage(
      video,
      (video.videoWidth - size / zoom) / 2,
      (video.videoHeight - size / zoom) / 2,
      size / zoom,
      size / zoom,
      -drawSize / 2,
      -drawSize / 2,
      drawSize,
      drawSize
    );

    ctx.restore();
  }

  ctx.filter = 'none';

  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
</script>
</body>
</html>
