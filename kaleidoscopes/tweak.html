<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaleidoscope Camera</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }

    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100%;
      width: 240px;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label { display: flex; flex-direction: column; font-size: 13px; }
    input, select, button { margin-top: 5px; }
    button { cursor: pointer; padding: 8px; border: none; border-radius: 6px; }
  </style>
</head>
<body>
<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas"></canvas>
<canvas id="frame" style="display:none"></canvas>

<div class="sidebar">
  <label>
    Zoom (smooth)
    <input id="zoom" type="range" min="0.6" max="2" step="0.01" value="0.9">
  </label>

  <label>
    Panes
    <input id="slices" type="range" min="4" max="24" step="1" value="12">
  </label>

  <label>
    Hue Shift
    <input id="hue" type="range" min="0" max="360" step="1" value="0">
  </label>

  <label>
    Saturation
    <input id="sat" type="range" min="0" max="4" step="0.1" value="1">
  </label>

  <label>
    Contrast
    <input id="con" type="range" min="0.5" max="3" step="0.1" value="1">
  </label>

  <label>
    Filter
    <select id="filter">
      <option value="none">None</option>
      <option value="grayscale(1)">Grayscale</option>
      <option value="sepia(1)">Sepia</option>
      <option value="invert(1)">Invert</option>
      <option value="contrast(2)">High Contrast</option>
      <option value="saturate(3)">Vivid</option>
      <option value="blur(3px)">Soft Blur</option>
      <option value="brightness(1.5)">Bright</option>
      <option value="hue-rotate(180deg)">Cool Shift</option>
      <option value="saturate(5) contrast(3)">Neon Pop</option>
      <option value="grayscale(1) contrast(2)">Film Noir</option>
      <option value="invert(1) hue-rotate(180deg)">Psychedelic</option>
    </select>
  </label>

  <label>
    RGB Split
    <input id="rgbSplit" type="range" min="0" max="30" step="1" value="0">
  </label>

  <label>
    Disco Mode
    <input id="disco" type="checkbox">
  </label>

  <button id="fsBtn">Fullscreen</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const frame = document.getElementById('frame');
const fctx = frame.getContext('2d');

const zoomSlider = document.getElementById('zoom');
const sliceSlider = document.getElementById('slices');
const filterSelect = document.getElementById('filter');
const discoToggle = document.getElementById('disco');
const fsBtn = document.getElementById('fsBtn');
const rgbSplitSlider = document.getElementById('rgbSplit');

const hueSlider = document.getElementById('hue');
const satSlider = document.getElementById('sat');
const conSlider = document.getElementById('con');

let discoHue = 0;

const objects = [];

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  frame.width = window.innerWidth;
  frame.height = window.innerHeight;
}
resize();

fsBtn.addEventListener('click', async () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) await el.requestFullscreen();
  else await document.exitFullscreen();
});

canvas.addEventListener('click', (e) => {
  objects.push({ x: e.clientX, y: e.clientY, r: 6 });
});

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    requestAnimationFrame(draw);
  });

function getSmoothZoom() {
  const min = 0.6;
  const max = 2;
  const v = parseFloat(zoomSlider.value);
  const t = (v - min) / (max - min);
  return min * Math.pow(max / min, t);
}

function drawObjects(ctx, centerX, centerY, angle) {
  const cos = Math.cos(-angle);
  const sin = Math.sin(-angle);

  for (const o of objects) {
    const dx = o.x - centerX;
    const dy = o.y - centerY;

    const rx = dx * cos - dy * sin;
    const ry = dx * sin + dy * cos;

    ctx.beginPath();
    ctx.fillStyle = 'white';
    ctx.arc(rx, ry, o.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function buildFilter() {
  const base = filterSelect.value;

  let hue = parseFloat(hueSlider.value);
  if (discoToggle.checked) {
    discoHue += 2;
    hue += discoHue;
  }

  const sat = satSlider.value;
  const con = conSlider.value;

  return `${base} hue-rotate(${hue}deg) saturate(${sat}) contrast(${con})`;
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  const size = Math.hypot(w, h);
  const zoom = getSmoothZoom();
  const slices = parseInt(sliceSlider.value);

  const centerX = w / 2;
  const centerY = h / 2;

  fctx.setTransform(1,0,0,1,0,0);
  fctx.clearRect(0,0,frame.width,frame.height);

  fctx.filter = buildFilter();
  fctx.drawImage(video, 0, 0, frame.width, frame.height);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,w,h);

  const angleStep = (Math.PI * 2) / slices;
  const drawSize = size * zoom;

  for (let i = 0; i < slices; i++) {
    const a = i * angleStep;

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(a);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, size / 2, -angleStep / 2, angleStep / 2);
    ctx.closePath();
    ctx.clip();

    if (i % 2 === 0) ctx.scale(1, -1);

    const sx = (frame.width - size / zoom) / 2;
    const sy = (frame.height - size / zoom) / 2;
    const sw = size / zoom;
    const sh = size / zoom;

    const split = parseFloat(rgbSplitSlider.value);

    ctx.drawImage(frame, sx, sy, sw, sh, -drawSize / 2, -drawSize / 2, drawSize, drawSize);

    if (split > 0) {
      ctx.globalAlpha = 0.28;
      ctx.globalCompositeOperation = 'lighter';

      // red fringe
      ctx.filter = 'opacity(1)';
      ctx.drawImage(
        frame,
        sx - split,
        sy,
        sw,
        sh,
        -drawSize / 2,
        -drawSize / 2,
        drawSize,
        drawSize
      );

      // cyan fringe
      ctx.drawImage(
        frame,
        sx + split,
        sy,
        sw,
        sh,
        -drawSize / 2,
        -drawSize / 2,
        drawSize,
        drawSize
      );

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.filter = 'none';
    }

    drawObjects(ctx, centerX, centerY, a);

    ctx.restore();
  }

  fctx.filter = 'none';
  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
</script>
</body>
</html>
