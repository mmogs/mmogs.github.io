<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaleidoscope Camera</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<video id="video" autoplay playsinline style="display:none"></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    requestAnimationFrame(draw);
  })
  .catch(() => alert('Camera access denied'));

function draw() {
  const w = canvas.width;
  const h = canvas.height;
  const size = Math.min(w, h); // square crop so it's centered evenly

  ctx.clearRect(0, 0, w, h);

  const slices = 12;
  const angle = (Math.PI * 2) / slices;

  for (let i = 0; i < slices; i++) {
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(i * angle);

    // Create wedge shape (triangle slice)
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, size / 2, -angle / 2, angle / 2);
    ctx.closePath();
    ctx.clip();

    if (i % 2 === 0) {
      ctx.scale(1, -1);
    }

    // Draw centered square from video
    ctx.drawImage(
      video,
      (video.videoWidth - size) / 2,
      (video.videoHeight - size) / 2,
      size,
      size,
      -size / 2,
      -size / 2,
      size,
      size
    );

    ctx.restore();
  }

  requestAnimationFrame(draw);
}

window.addEventListener('resize', resize);
</script>
</body>
</html>
