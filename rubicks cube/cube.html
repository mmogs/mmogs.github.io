<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Rubik's Cube</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0a0e27;
      font-family: Arial, sans-serif;
    }
    #canvas {
      display: block;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #00ff88;
      text-align: center;
      font-size: 14px;
      text-shadow: 0 0 10px #00ff88;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <p>Drag to rotate | Arrow keys to scramble | SPACE to solve</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0a0e27);
    camera.position.z = 5;

    const neonColors = [
      0xff006e, // Hot pink
      0x00f5ff, // Cyan
      0xffbe0b, // Yellow
      0xfb5607, // Orange
      0x8338ec, // Purple
      0xffffff  // White
    ];

    const cubelets = [];
    const groupRotations = {};

    function createCubelet(x, y, z) {
      const geometry = new THREE.BoxGeometry(0.95, 0.95, 0.95);
      const materials = [];
      
      for (let i = 0; i < 6; i++) {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#' + neonColors[i].toString(16).padStart(6, '0');
        ctx.fillRect(0, 0, 64, 64);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(2, 2, 60, 60);
        
        const texture = new THREE.CanvasTexture(canvas);
        materials.push(new THREE.MeshPhongMaterial({ map: texture }));
      }
      
      const cubelet = new THREE.Mesh(geometry, materials);
      cubelet.position.set(x, y, z);
      cubelet.originalPosition = new THREE.Vector3(x, y, z);
      cubelet.originalRotation = new THREE.Euler(0, 0, 0);
      return cubelet;
    }

    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const cubelet = createCubelet(x, y, z);
          scene.add(cubelet);
          cubelets.push(cubelet);
        }
      }
    }

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    let mouseDown = false, mouseX = 0, mouseY = 0;
    let rotationX = 0, rotationY = 0;

    document.addEventListener('mousedown', (e) => {
      mouseDown = true;
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      if (mouseDown) {
        rotationY += (e.clientX - mouseX) * 0.01;
        rotationX += (e.clientY - mouseY) * 0.01;
        mouseX = e.clientX;
        mouseY = e.clientY;
      }
    });

    document.addEventListener('mouseup', () => {
      mouseDown = false;
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
        scramble();
      }
      if (e.code === 'Space') {
        solveCube();
      }
    });

    function scramble() {
      cubelets.forEach(cubelet => {
        cubelet.position.copy(cubelet.originalPosition).multiplyScalar(1 + (Math.random() - 0.5) * 0.1);
        cubelet.rotation.x += Math.random() * 0.5;
        cubelet.rotation.y += Math.random() * 0.5;
        cubelet.rotation.z += Math.random() * 0.5;
      });
    }

    function solveCube() {
      cubelets.forEach(cubelet => {
        cubelet.position.lerp(cubelet.originalPosition, 0.1);
        cubelet.rotation.x += (cubelet.originalRotation.x - cubelet.rotation.x) * 0.1;
        cubelet.rotation.y += (cubelet.originalRotation.y - cubelet.rotation.y) * 0.1;
        cubelet.rotation.z += (cubelet.originalRotation.z - cubelet.rotation.z) * 0.1;
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      
      scene.rotation.x = rotationX;
      scene.rotation.y = rotationY;
      
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
