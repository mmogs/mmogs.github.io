<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rubik Cube Working</title>
<style>
  body { margin:0; overflow:hidden; background:#111; }
  canvas { display:block; }
  #info {
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
  }
</style>
</head>
<body>

<div id="info">
Right-click drag = camera<br>
Left-click = select layer<br>
A / D = rotate
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();

// ✅ CAMERA FIX
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(5,5,5);
camera.lookAt(0,0,0);

// ✅ RENDERER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

// resize
window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// disable right click menu
window.addEventListener("contextmenu", e=>e.preventDefault());

// ✅ LIGHTING (IMPORTANT)
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5,5,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0x404040);
scene.add(ambient);

// colors
const colors = {
  x1: 0xff0000,
  x_1: 0xff8800,
  y1: 0xffffff,
  y_1: 0xffff00,
  z1: 0x00ff00,
  z_1: 0x0000ff,
  empty: 0x222222
};

const cubies = [];
let isTurning = false;
let selectedAxis = null;
let selectedIndex = null;

// ✅ BUILD CUBE
for(let x=-1;x<=1;x++){
for(let y=-1;y<=1;y++){
for(let z=-1;z<=1;z++){

  const geo = new THREE.BoxGeometry(1,1,1);

  const mats = [
    new THREE.MeshStandardMaterial({color: x===1?colors.x1:colors.empty}),
    new THREE.MeshStandardMaterial({color: x===-1?colors.x_1:colors.empty}),
    new THREE.MeshStandardMaterial({color: y===1?colors.y1:colors.empty}),
    new THREE.MeshStandardMaterial({color: y===-1?colors.y_1:colors.empty}),
    new THREE.MeshStandardMaterial({color: z===1?colors.z1:colors.empty}),
    new THREE.MeshStandardMaterial({color: z===-1?colors.z_1:colors.empty}),
  ];

  const cube = new THREE.Mesh(geo, mats);
  cube.position.set(x,y,z);

  scene.add(cube);
  cubies.push(cube);

}}}

// ===== CAMERA (RIGHT CLICK) =====
let rotating=false, prev={x:0,y:0};

document.addEventListener("mousedown",e=>{
  if(e.button===2){
    rotating=true;
    prev.x=e.clientX;
    prev.y=e.clientY;
  }
});

document.addEventListener("mouseup",()=>rotating=false);

document.addEventListener("mousemove",e=>{
  if(!rotating) return;

  scene.rotation.y += (e.clientX-prev.x)*0.005;
  scene.rotation.x += (e.clientY-prev.y)*0.005;

  prev.x=e.clientX;
  prev.y=e.clientY;
});

// ===== PICK =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function pick(e){
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(cubies);

  return hits.length ? hits[0].object : null;
}

// ===== SELECT =====
document.addEventListener("click", e=>{
  if(e.button!==0) return;

  const obj = pick(e);
  if(!obj) return;

  selectedAxis = "y";
  selectedIndex = Math.round(obj.position.y);

  cubies.forEach(c=>{
    c.material.forEach(m=>{
      m.opacity = Math.round(c.position.y)===selectedIndex ? 0.4 : 1;
      m.transparent = true;
    });
  });
});

// ===== ROTATE =====
function rotateLayer(axis,index,dir){
  if(isTurning) return;
  isTurning=true;

  const group=new THREE.Group();
  scene.add(group);

  cubies.forEach(c=>{
    if(Math.round(c.position[axis])===index){
      group.attach(c);
    }
  });

  const start=performance.now();

  function anim(t){
    const p=Math.min((t-start)/150,1);
    group.rotation[axis]=p*Math.PI/2*dir;

    if(p<1){
      requestAnimationFrame(anim);
    } else {
      group.children.slice().forEach(c=>{
        scene.attach(c);

        c.position.x=Math.round(c.position.x);
        c.position.y=Math.round(c.position.y);
        c.position.z=Math.round(c.position.z);
      });

      scene.remove(group);
      isTurning=false;
    }
  }

  requestAnimationFrame(anim);
}

// ===== KEYS =====
document.addEventListener("keydown", e=>{
  if(!selectedAxis) return;

  if(e.key==="a") rotateLayer(selectedAxis, selectedIndex, -1);
  if(e.key==="d") rotateLayer(selectedAxis, selectedIndex, 1);
});

// render
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
