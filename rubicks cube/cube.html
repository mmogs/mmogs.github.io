<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rubik Cube Working</title>
<style>
  body { margin:0; overflow:hidden; background:#111; }
  canvas { display:block; }
  #info {
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
  }
</style>
</head>
<body>

<div id="info">
Right-click drag = camera<br>
Left-click = select layer (turns transparent)<br>
A / D = rotate
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(6,6,6);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.addEventListener("contextmenu", e=>e.preventDefault());

const cubies = [];
let isTurning = false;

let selectedAxis = null;
let selectedIndex = null;

// build cube
for(let x=-1;x<=1;x++){
for(let y=-1;y<=1;y++){
for(let z=-1;z<=1;z++){

  const geo = new THREE.BoxGeometry(1,1,1);

  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent:true,
    opacity:1
  });

  const cube = new THREE.Mesh(geo, mat);
  cube.position.set(x,y,z);

  cube.userData = {x,y,z};

  scene.add(cube);
  cubies.push(cube);

}}}

// ===== CAMERA (RIGHT CLICK) =====
let rotating=false, prev={x:0,y:0};

document.addEventListener("mousedown",e=>{
  if(e.button===2){
    rotating=true;
    prev.x=e.clientX;
    prev.y=e.clientY;
  }
});

document.addEventListener("mouseup",()=>rotating=false);

document.addEventListener("mousemove",e=>{
  if(!rotating) return;

  scene.rotation.y += (e.clientX-prev.x)*0.005;
  scene.rotation.x += (e.clientY-prev.y)*0.005;

  prev.x=e.clientX;
  prev.y=e.clientY;
});

// ===== SIMPLE CLICK SELECT (NO NORMALS) =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function pick(e){
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(cubies);

  return hits.length ? hits[0].object : null;
}

document.addEventListener("click", e=>{
  if(e.button!==0) return;

  const obj = pick(e);
  if(!obj) return;

  // SIMPLE: always pick Y layer (reliable baseline)
  selectedAxis = "y";
  selectedIndex = Math.round(obj.position.y);

  // highlight
  cubies.forEach(c=>{
    if(Math.round(c.position.y)===selectedIndex){
      c.material.opacity = 0.4;
    } else {
      c.material.opacity = 1;
    }
  });
});

// ===== ROTATE =====
function rotateLayer(axis,index,dir){
  if(isTurning) return;
  isTurning=true;

  const group = new THREE.Group();
  scene.add(group);

  cubies.forEach(c=>{
    if(Math.round(c.position[axis])===index){
      group.attach(c);
    }
  });

  const start = performance.now();

  function anim(t){
    const p = Math.min((t-start)/150,1);
    group.rotation[axis] = p * Math.PI/2 * dir;

    if(p<1){
      requestAnimationFrame(anim);
    } else {

      group.children.slice().forEach(c=>{
        scene.attach(c);

        c.position.x = Math.round(c.position.x);
        c.position.y = Math.round(c.position.y);
        c.position.z = Math.round(c.position.z);
      });

      scene.remove(group);
      isTurning=false;
    }
  }

  requestAnimationFrame(anim);
}

// ===== KEYS =====
document.addEventListener("keydown", e=>{
  if(!selectedAxis) return;

  if(e.key==="a") rotateLayer(selectedAxis, selectedIndex, -1);
  if(e.key==="d") rotateLayer(selectedAxis, selectedIndex, 1);
});

// render
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();
</script>

</body>
</html>
