<!DOCTYPE html>
<html>
<head>
  <title>JS Rubik's Cube</title>
  <style>
    body { font-family: Arial; text-align: center; }
    .cube { display: grid; grid-template-columns: repeat(12, 30px); gap: 2px; justify-content: center; margin: 20px; }
    .cell { width: 30px; height: 30px; border: 1px solid #000; }
    button { margin: 5px; padding: 8px 12px; }
  </style>
</head>
<body>

<h2>Rubik's Cube</h2>

<div id="cube" class="cube"></div>

<div>
  <button onclick="move('U')">U</button>
  <button onclick="move('D')">D</button>
  <button onclick="move('L')">L</button>
  <button onclick="move('R')">R</button>
  <button onclick="move('F')">F</button>
  <button onclick="move('B')">B</button>
  <button onclick="scramble()">Scramble</button>
</div>

<script>
const colors = {
  U: "white",
  D: "yellow",
  F: "green",
  B: "blue",
  L: "orange",
  R: "red"
};

// cube state (6 faces, 9 stickers each)
let cube = {
  U: Array(9).fill(colors.U),
  D: Array(9).fill(colors.D),
  F: Array(9).fill(colors.F),
  B: Array(9).fill(colors.B),
  L: Array(9).fill(colors.L),
  R: Array(9).fill(colors.R),
};

function rotateFace(face) {
  const c = cube[face];
  cube[face] = [c[6], c[3], c[0], c[7], c[4], c[1], c[8], c[5], c[2]];
}

function move(m) {
  rotateFace(m);

  // simplified edge swaps (basic but valid rotations)
  let temp;

  if (m === "U") {
    temp = cube.F.slice(0,3);
    cube.F.splice(0,3, ...cube.R.slice(0,3));
    cube.R.splice(0,3, ...cube.B.slice(0,3));
    cube.B.splice(0,3, ...cube.L.slice(0,3));
    cube.L.splice(0,3, ...temp);
  }

  if (m === "D") {
    temp = cube.F.slice(6,9);
    cube.F.splice(6,3, ...cube.L.slice(6,9));
    cube.L.splice(6,3, ...cube.B.slice(6,9));
    cube.B.splice(6,3, ...cube.R.slice(6,9));
    cube.R.splice(6,3, ...temp);
  }

  if (m === "F") {
    temp = [cube.U[6], cube.U[7], cube.U[8]];
    [cube.U[6], cube.U[7], cube.U[8]] =
      [cube.L[8], cube.L[5], cube.L[2]];
    [cube.L[2], cube.L[5], cube.L[8]] =
      [cube.D[2], cube.D[1], cube.D[0]];
    [cube.D[0], cube.D[1], cube.D[2]] =
      [cube.R[6], cube.R[3], cube.R[0]];
    [cube.R[0], cube.R[3], cube.R[6]] = temp;
  }

  if (m === "B") {
    temp = [cube.U[0], cube.U[1], cube.U[2]];
    [cube.U[0], cube.U[1], cube.U[2]] =
      [cube.R[2], cube.R[5], cube.R[8]];
    [cube.R[2], cube.R[5], cube.R[8]] =
      [cube.D[8], cube.D[7], cube.D[6]];
    [cube.D[6], cube.D[7], cube.D[8]] =
      [cube.L[0], cube.L[3], cube.L[6]];
    [cube.L[0], cube.L[3], cube.L[6]] = temp;
  }

  if (m === "L") {
    temp = [cube.U[0], cube.U[3], cube.U[6]];
    [cube.U[0], cube.U[3], cube.U[6]] =
      [cube.B[8], cube.B[5], cube.B[2]];
    [cube.B[2], cube.B[5], cube.B[8]] =
      [cube.D[0], cube.D[3], cube.D[6]];
    [cube.D[0], cube.D[3], cube.D[6]] =
      [cube.F[0], cube.F[3], cube.F[6]];
    [cube.F[0], cube.F[3], cube.F[6]] = temp;
  }

  if (m === "R") {
    temp = [cube.U[2], cube.U[5], cube.U[8]];
    [cube.U[2], cube.U[5], cube.U[8]] =
      [cube.F[2], cube.F[5], cube.F[8]];
    [cube.F[2], cube.F[5], cube.F[8]] =
      [cube.D[2], cube.D[5], cube.D[8]];
    [cube.D[2], cube.D[5], cube.D[8]] =
      [cube.B[6], cube.B[3], cube.B[0]];
    [cube.B[0], cube.B[3], cube.B[6]] = temp;
  }

  render();
}

function scramble() {
  const moves = ["U","D","L","R","F","B"];
  for (let i = 0; i < 20; i++) {
    move(moves[Math.floor(Math.random()*6)]);
  }
}

function render() {
  const cubeDiv = document.getElementById("cube");
  cubeDiv.innerHTML = "";

  const layout = [
    ...Array(3).fill(null), ...cube.U.slice(0,3), ...Array(3).fill(null),
    ...Array(3).fill(null), ...cube.U.slice(3,6), ...Array(3).fill(null),
    ...Array(3).fill(null), ...cube.U.slice(6,9), ...Array(3).fill(null),

    ...cube.L.slice(0,3), ...cube.F.slice(0,3), ...cube.R.slice(0,3), ...cube.B.slice(0,3),
    ...cube.L.slice(3,6), ...cube.F.slice(3,6), ...cube.R.slice(3,6), ...cube.B.slice(3,6),
    ...cube.L.slice(6,9), ...cube.F.slice(6,9), ...cube.R.slice(6,9), ...cube.B.slice(6,9),

    ...Array(3).fill(null), ...cube.D.slice(0,3), ...Array(3).fill(null),
    ...Array(3).fill(null), ...cube.D.slice(3,6), ...Array(3).fill(null),
    ...Array(3).fill(null), ...cube.D.slice(6,9), ...Array(3).fill(null),
  ];

  layout.forEach(color => {
    const div = document.createElement("div");
    div.className = "cell";
    if (color) div.style.background = color;
    cubeDiv.appendChild(div);
  });
}

render();
</script>

</body>
</html>
