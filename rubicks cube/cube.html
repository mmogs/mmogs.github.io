<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rubik Cube Stable</title>
<style>
  body { margin:0; overflow:hidden; background:#111; }
  canvas { display:block; }
  #info {
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
  }
</style>
</head>
<body>

<div id="info">
Right-click drag = camera<br>
Left-click = select layer<br>
A / D = rotate layer
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(5,5,5);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.addEventListener("contextmenu", e=>e.preventDefault());

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,5,5);
scene.add(light);

// COLORS
const colors = {
  r:0xff0000, o:0xff8800, w:0xffffff,
  y:0xffff00, g:0x00ff00, b:0x0000ff,
  empty:0x111111
};

const cubies = [];
let isTurning=false;

let selectedAxis=null;
let selectedIndex=null;

// BUILD CUBE
for(let x=-1;x<=1;x++){
for(let y=-1;y<=1;y++){
for(let z=-1;z<=1;z++){

  const geo = new THREE.BoxGeometry(1,1,1);

  const mats = [
    new THREE.MeshStandardMaterial({color: x===1?colors.r:colors.empty}),
    new THREE.MeshStandardMaterial({color: x===-1?colors.o:colors.empty}),
    new THREE.MeshStandardMaterial({color: y===1?colors.w:colors.empty}),
    new THREE.MeshStandardMaterial({color: y===-1?colors.y:colors.empty}),
    new THREE.MeshStandardMaterial({color: z===1?colors.g:colors.empty}),
    new THREE.MeshStandardMaterial({color: z===-1?colors.b:colors.empty}),
  ];

  const cube = new THREE.Mesh(geo, mats);
  cube.position.set(x,y,z);

  // edges (real cube look)
  const edges = new THREE.EdgesGeometry(geo);
  cube.add(new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0x000000})));

  scene.add(cube);
  cubies.push(cube);

}}}

// CAMERA (RIGHT CLICK DRAG)
let dragging=false, prev={x:0,y:0};

document.addEventListener("mousedown",e=>{
  if(e.button===2){
    dragging=true;
    prev.x=e.clientX;
    prev.y=e.clientY;
  }
});

document.addEventListener("mouseup",()=>dragging=false);

document.addEventListener("mousemove",e=>{
  if(!dragging) return;

  scene.rotation.y += (e.clientX-prev.x)*0.005;
  scene.rotation.x += (e.clientY-prev.y)*0.005;

  prev.x=e.clientX;
  prev.y=e.clientY;
});

// RAYCAST
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function getHit(e){
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;

  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(cubies);

  return hits.length ? hits[0].object : null;
}

// SELECT LAYER (FIXED)
document.addEventListener("click", e=>{
  if(e.button!==0) return;

  const obj = getHit(e);
  if(!obj) return;

  const p = obj.position;

  // ALWAYS pick strongest axis by position (NOT face normal)
  const ax = Math.abs(p.x);
  const ay = Math.abs(p.y);
  const az = Math.abs(p.z);

  if(ax > ay && ax > az){
    selectedAxis="x";
    selectedIndex=Math.round(p.x);
  } else if(ay > ax && ay > az){
    selectedAxis="y";
    selectedIndex=Math.round(p.y);
  } else {
    selectedAxis="z";
    selectedIndex=Math.round(p.z);
  }

  // highlight
  cubies.forEach(c=>{
    const match = selectedAxis && Math.round(c.position[selectedAxis])===selectedIndex;

    c.material.forEach(m=>{
      m.emissive = new THREE.Color(match ? 0x444400 : 0x000000);
      m.transparent = true;
      m.opacity = match ? 0.7 : 1;
    });
  });
});

// ROTATE
function rotateLayer(axis,index,dir){
  if(isTurning || !axis) return;
  isTurning=true;

  const group=new THREE.Group();
  scene.add(group);

  cubies.forEach(c=>{
    if(Math.round(c.position[axis])===index){
      group.attach(c);
    }
  });

  const start=performance.now();

  function anim(t){
    const p=Math.min((t-start)/150,1);
    group.rotation[axis]=p*Math.PI/2*dir;

    if(p<1){
      requestAnimationFrame(anim);
    } else {
      group.children.slice().forEach(c=>{
        scene.attach(c);
        c.position.x=Math.round(c.position.x);
        c.position.y=Math.round(c.position.y);
        c.position.z=Math.round(c.position.z);
      });

      scene.remove(group);
      isTurning=false;
    }
  }

  requestAnimationFrame(anim);
}

// KEYS
document.addEventListener("keydown",e=>{
  if(!selectedAxis) return;

  if(e.key==="a") rotateLayer(selectedAxis,selectedIndex,-1);
  if(e.key==="d") rotateLayer(selectedAxis,selectedIndex,1);
});

// LOOP
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
