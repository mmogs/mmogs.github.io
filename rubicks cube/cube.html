<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Rubik's Cube</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0a0e27;
      font-family: Arial, sans-serif;
    }
    #canvas {
      display: block;
    }
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #00ff88;
      text-align: center;
      font-size: 14px;
      text-shadow: 0 0 10px #00ff88;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="controls">
    <p>Drag to rotate | U D L R F B to turn faces | Arrow keys scramble | SPACE resets</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0a0e27);
    camera.position.z = 5;

    const faceColors = {
      R: 0x0000ff,
      L: 0x00ff00,
      U: 0xffffff,
      D: 0xffff00,
      F: 0xff0000,
      B: 0xffa500,
      blank: 0x111111
    };

    const cubelets = [];
    let rotating = false;

    const axisVectors = {
      x: new THREE.Vector3(1, 0, 0),
      y: new THREE.Vector3(0, 1, 0),
      z: new THREE.Vector3(0, 0, 1)
    };

    function createCubelet(x, y, z) {
      const geometry = new THREE.BoxGeometry(0.95, 0.95, 0.95);
      const colors = [
        x === 1 ? faceColors.R : faceColors.blank,
        x === -1 ? faceColors.L : faceColors.blank,
        y === 1 ? faceColors.U : faceColors.blank,
        y === -1 ? faceColors.D : faceColors.blank,
        z === 1 ? faceColors.F : faceColors.blank,
        z === -1 ? faceColors.B : faceColors.blank
      ];
      const materials = colors.map(color => new THREE.MeshPhongMaterial({ color, shininess: 50 }));

      const cubelet = new THREE.Mesh(geometry, materials);
      cubelet.position.set(x, y, z);
      cubelet.userData = {
        originalPosition: new THREE.Vector3(x, y, z),
        originalRotation: new THREE.Euler(0, 0, 0)
      };
      return cubelet;
    }

    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const cubelet = createCubelet(x, y, z);
          scene.add(cubelet);
          cubelets.push(cubelet);
        }
      }
    }

    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    let mouseDown = false;
    let mouseX = 0;
    let mouseY = 0;
    let rotationX = 0;
    let rotationY = 0;

    document.addEventListener('mousedown', (e) => {
      mouseDown = true;
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    document.addEventListener('mousemove', (e) => {
      if (mouseDown) {
        rotationY += (e.clientX - mouseX) * 0.01;
        rotationX += (e.clientY - mouseY) * 0.01;
        mouseX = e.clientX;
        mouseY = e.clientY;
      }
    });

    document.addEventListener('mouseup', () => {
      mouseDown = false;
    });

    const moveMap = {
      U: () => rotateSlice('y', 1, -1),
      D: () => rotateSlice('y', -1, 1),
      L: () => rotateSlice('x', -1, -1),
      R: () => rotateSlice('x', 1, 1),
      F: () => rotateSlice('z', 1, -1),
      B: () => rotateSlice('z', -1, 1)
    };

    document.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      if (moveMap[key]) {
        moveMap[key]();
      } else if (e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
        scramble();
      } else if (e.code === 'Space') {
        resetCube();
      }
    });

    function normalizeAngle(angle) {
      return Math.round(angle / (Math.PI / 2)) * (Math.PI / 2);
    }

    function finalizeCubelet(cubelet, worldMatrix) {
      cubelet.position.setFromMatrixPosition(worldMatrix);
      cubelet.rotation.setFromRotationMatrix(new THREE.Matrix4().extractRotation(worldMatrix));
      cubelet.position.x = Math.round(cubelet.position.x);
      cubelet.position.y = Math.round(cubelet.position.y);
      cubelet.position.z = Math.round(cubelet.position.z);
      cubelet.rotation.x = normalizeAngle(cubelet.rotation.x);
      cubelet.rotation.y = normalizeAngle(cubelet.rotation.y);
      cubelet.rotation.z = normalizeAngle(cubelet.rotation.z);
    }

    function rotateSlice(axis, layer, direction) {
      if (rotating) return;
      rotating = true;

      const slice = cubelets.filter(cubelet => Math.abs(cubelet.position[axis] - layer) < 0.1);
      if (!slice.length) {
        rotating = false;
        return;
      }

      const group = new THREE.Group();
      scene.add(group);
      slice.forEach(cubelet => group.add(cubelet));

      group.rotateOnAxis(axisVectors[axis], direction * Math.PI / 2);
      group.updateMatrixWorld(true);

      slice.forEach(cubelet => {
        const worldMatrix = cubelet.matrixWorld.clone();
        scene.attach(cubelet);
        finalizeCubelet(cubelet, worldMatrix);
      });

      scene.remove(group);
      rotating = false;
    }

    function scramble() {
      const moves = [
        ['y', 1, -1],
        ['y', -1, 1],
        ['x', -1, -1],
        ['x', 1, 1],
        ['z', 1, -1],
        ['z', -1, 1]
      ];

      for (let i = 0; i < 20; i++) {
        const [axis, layer, direction] = moves[Math.floor(Math.random() * moves.length)];
        rotateSlice(axis, layer, direction);
      }
    }

    function resetCube() {
      cubelets.forEach(cubelet => {
        cubelet.position.copy(cubelet.userData.originalPosition);
        cubelet.rotation.copy(cubelet.userData.originalRotation);
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      scene.rotation.x = rotationX;
      scene.rotation.y = rotationY;
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
