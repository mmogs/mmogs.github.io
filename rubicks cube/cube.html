<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rubik Cube Fixed Controls</title>
<style>
  body { margin:0; overflow:hidden; background:#111; }
  canvas { display:block; }
  #info {
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    z-index:10;
  }
</style>
</head>
<body>

<div id="info">
Right-click drag = camera<br>
Left-click drag = turn layer
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(6,6,6);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

window.addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

window.addEventListener("contextmenu", e => e.preventDefault());

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,5,5);
scene.add(light);

const colors = {
  U: 0xffffff,
  D: 0xffff00,
  F: 0x00ff00,
  B: 0x0000ff,
  L: 0xff8800,
  R: 0xff0000,
  EMPTY: 0x222222
};

const cubies = [];
let isTurning = false;

// ===== BUILD CUBE =====
for (let x=-1;x<=1;x++){
for (let y=-1;y<=1;y++){
for (let z=-1;z<=1;z++){

  const geo = new THREE.BoxGeometry(1,1,1);

  const mats = [
    new THREE.MeshBasicMaterial({color: x===1?colors.R:colors.EMPTY}),
    new THREE.MeshBasicMaterial({color: x===-1?colors.L:colors.EMPTY}),
    new THREE.MeshBasicMaterial({color: y===1?colors.U:colors.EMPTY}),
    new THREE.MeshBasicMaterial({color: y===-1?colors.D:colors.EMPTY}),
    new THREE.MeshBasicMaterial({color: z===1?colors.F:colors.EMPTY}),
    new THREE.MeshBasicMaterial({color: z===-1?colors.B:colors.EMPTY}),
  ];

  const cube = new THREE.Mesh(geo, mats);

  const edges = new THREE.EdgesGeometry(geo);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color:0x000000}));
  cube.add(line);

  cube.position.set(x,y,z);
  scene.add(cube);
  cubies.push(cube);

}}}

// ===== CAMERA CONTROL (RIGHT CLICK) =====
let draggingCamera = false;
let prev = {x:0,y:0};

document.addEventListener("mousedown", e=>{
  if(e.button===2){
    draggingCamera = true;
    prev.x = e.clientX;
    prev.y = e.clientY;
  }
});

document.addEventListener("mouseup", ()=> draggingCamera=false);

document.addEventListener("mousemove", e=>{
  if(!draggingCamera) return;

  let dx = e.clientX - prev.x;
  let dy = e.clientY - prev.y;

  scene.rotation.y += dx*0.005;
  scene.rotation.x += dy*0.005;

  prev.x = e.clientX;
  prev.y = e.clientY;
});

// ===== RAYCAST =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hit = null;

document.addEventListener("mousemove", e=>{
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;

  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(cubies);

  hit = hits.length ? hits[0] : null;
});

// ===== CORE FIX: PROPER LOCAL LAYER PICKING =====
function getLayer(cubie, axis){
  return Math.round(cubie.position[axis]);
}

// ===== ROTATION =====
function rotateLayer(axis, index, dir){
  if(isTurning) return;
  isTurning = true;

  const group = new THREE.Group();
  scene.add(group);

  cubies.forEach(c=>{
    if(Math.round(c.position[axis]) === index){
      group.attach(c);
    }
  });

  const angle = (Math.PI/2)*dir;
  const start = performance.now();

  function anim(t){
    const p = Math.min((t-start)/150,1);
    group.rotation[axis] = angle*p;

    if(p<1){
      requestAnimationFrame(anim);
    } else {
      group.children.slice().forEach(c=>{
        scene.attach(c);

        c.position.x = Math.round(c.position.x);
        c.position.y = Math.round(c.position.y);
        c.position.z = Math.round(c.position.z);

        c.rotation.set(0,0,0);
      });

      scene.remove(group);
      isTurning = false;
    }
  }

  requestAnimationFrame(anim);
}

// ===== LEFT CLICK DRAG (FIXED + RELIABLE) =====
let dragStart = null;

document.addEventListener("mousedown", e=>{
  if(e.button===0 && hit){
    dragStart = {
      x:e.clientX,
      y:e.clientY,
      cubie:hit.object
    };
  }
});

document.addEventListener("mouseup", e=>{
  if(e.button!==0 || !dragStart || isTurning) return;

  let dx = e.clientX - dragStart.x;
  let dy = e.clientY - dragStart.y;

  if(Math.abs(dx)<5 && Math.abs(dy)<5){
    dragStart=null;
    return;
  }

  const absX = Math.abs(dx);
  const absY = Math.abs(dy);

  const pos = dragStart.cubie.position;

  // KEY FIX: ALWAYS USE LOCAL GRID POSITION
  if(absX > absY){
    rotateLayer("y", Math.round(pos.y), Math.sign(dx));
  } else {
    rotateLayer("x", Math.round(pos.x), Math.sign(dy));
  }

  dragStart = null;
});

// render loop
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
