<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Neon Rubik's Cube</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, #050510, #000);
  }
  canvas { display: block; }
</style>
</head>
<body>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(6, 6, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Neon glow lighting
const light = new THREE.PointLight(0x00ffff, 2, 50);
light.position.set(10, 10, 10);
scene.add(light);

scene.add(new THREE.AmbientLight(0x222222));

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Neon colors
const colors = {
  up:    0xff00ff, // neon pink
  down:  0x00ffff, // cyan
  left:  0x39ff14, // neon green
  right: 0xff073a, // neon red
  front: 0xffa500, // neon orange
  back:  0x7f00ff  // neon purple
};

const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

const size = 0.95;
const gap = 0.05;

function createSticker(color) {
  return new THREE.MeshStandardMaterial({
    color,
    emissive: color,
    emissiveIntensity: 0.6,
    roughness: 0.2,
    metalness: 0.6
  });
}

function createCubelet(x, y, z) {
  const geometry = new THREE.BoxGeometry(size, size, size);

  const materials = [
    createSticker(colors.right),
    createSticker(colors.left),
    createSticker(colors.up),
    createSticker(colors.down),
    createSticker(colors.front),
    createSticker(colors.back)
  ];

  const cube = new THREE.Mesh(geometry, materials);
  cube.position.set(
    x * (size + gap),
    y * (size + gap),
    z * (size + gap)
  );

  return cube;
}

// build 3x3x3 cube
for (let x = -1; x <= 1; x++) {
  for (let y = -1; y <= 1; y++) {
    for (let z = -1; z <= 1; z++) {
      cubeGroup.add(createCubelet(x, y, z));
    }
  }
}

// simple animation loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
