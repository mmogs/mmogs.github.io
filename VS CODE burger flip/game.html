<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Flipper Game</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="container">
        <h1>Burger Flip</h1>
        <div class="info">
            <p>Press <strong>SPACE</strong> or <strong>UP ARROW</strong> to flip the spatula</p>
            <p>Land the burger back on the spatula to score points!</p>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="score-display">
            <p>Score: <span id="score">0</span></p>
            <p id="gameOverText" class="game-over-text"></p>
        </div>
        <button id="restartBtn" class="restart-btn" style="display: none;">Restart Game</button>
    </div>
    <script src="game.js"></script>
</body>
</html>
