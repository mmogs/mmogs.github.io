<!DOCTYPE html>
<html>
<head>
  <title>Motion + Face Tracker</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h2 { margin: 10px; }

    video { display: none; }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body>

<h2>Motion + Face Tracking</h2>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<!-- 🔊 YOUR SOUNDS -->
<audio class="sound" src="sound1.mp3"></audio>
<audio class="sound" src="sound2.mp3"></audio>
<audio class="sound" src="sound3.mp3"></audio>
<audio class="sound" src="sound4.mp3"></audio>
<audio class="sound" src="sound5.mp3"></audio>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const sounds = document.querySelectorAll(".sound");

let audioReady = true;

// unlock audio
document.body.addEventListener("click", () => {
  sounds.forEach(s => {
    s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(()=>{});
  });
});

sounds.forEach(s => {
  s.onended = () => audioReady = true;
});

function playRandomSound() {
  const s = sounds[Math.floor(Math.random()*sounds.length)];
  s.currentTime = 0;
  s.play();
}

// ======================
// FACE TRACKING
// ======================

const faceMesh = new FaceMesh({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
  if (!results.multiFaceLandmarks.length) return;

  const lm = results.multiFaceLandmarks[0];

  // ===== BLINK (eye openness) =====
  const eyeTop = lm[159];
  const eyeBottom = lm[145];

  const eyeOpen = Math.abs(eyeTop.y - eyeBottom.y);

  if (eyeOpen < 0.01) {
    console.log("BLINK");
  }

  // ===== SMILE =====
  const leftMouth = lm[61];
  const rightMouth = lm[291];
  const topLip = lm[13];
  const bottomLip = lm[14];

  const mouthWidth = Math.abs(leftMouth.x - rightMouth.x);
  const mouthHeight = Math.abs(topLip.y - bottomLip.y);

  if (mouthWidth / mouthHeight > 2.5) {
    console.log("SMILE");
  }

  // ===== HEAD TURN =====
  const nose = lm[1];
  const leftEye = lm[33];
  const rightEye = lm[263];

  const faceCenter = (leftEye.x + rightEye.x) / 2;
  const turn = nose.x - faceCenter;

  if (turn > 0.05) console.log("LOOKING RIGHT");
  if (turn < -0.05) console.log("LOOKING LEFT");
});

// ======================
// CAMERA
// ======================

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  video.srcObject = stream;

  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const camera = new Camera(video, {
      onFrame: async () => {
        await faceMesh.send({ image: video });
      },
      width: video.videoWidth,
      height: video.videoHeight
    });

    camera.start();
  };
});

</script>

</body>
</html>
