<!DOCTYPE html>
<html>
<head>
  <title>Motion Detector (Fixed + Sound + Boxes)</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h2 {
      margin: 10px;
    }

    video {
      display: none;
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>
</head>

<body>

<h2>Motion Detector</h2>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<!-- Reliable audio source -->
<audio id="boom" preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_8b3c7c2b3c.mp3" type="audio/mpeg">
  <source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg">
</audio>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const boom = document.getElementById("boom");

let lastFrame = null;

// sensitivity (lower = more sensitive)
const threshold = 25;

// allow audio
document.body.addEventListener("click", () => {
  boom.play().then(() => {
    boom.pause();
    boom.currentTime = 0;
  }).catch(() => {});
});

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;

    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      startDetection();
    };
  });

function startDetection() {
  const tempCanvas = document.createElement("canvas");
  const tempCtx = tempCanvas.getContext("2d");

  setInterval(() => {
    if (video.readyState !== 4) return;

    tempCanvas.width = video.videoWidth;
    tempCanvas.height = video.videoHeight;

    tempCtx.drawImage(video, 0, 0);

    const frame = tempCtx.getImageData(
      0, 0,
      tempCanvas.width,
      tempCanvas.height
    );

    if (!lastFrame) {
      lastFrame = frame;
      return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let motionDetected = false;

    const step = 25;

    for (let y = 0; y < canvas.height; y += step) {
      for (let x = 0; x < canvas.width; x += step) {

        const i = (y * canvas.width + x) * 4;

        const diff =
          Math.abs(frame.data[i] - lastFrame.data[i]) +
          Math.abs(frame.data[i+1] - lastFrame.data[i+1]) +
          Math.abs(frame.data[i+2] - lastFrame.data[i+2]);

        if (diff > threshold * 3) {
          ctx.strokeStyle = "red";
          ctx.strokeRect(x, y, step, step);
          motionDetected = true;
        }
      }
    }

    if (motionDetected) {
      boom.pause();
      boom.currentTime = 0;
      boom.play().catch(err => console.log("Audio blocked:", err));
    }

    lastFrame = frame;

  }, 100);
}
</script>

</body>
</html>
