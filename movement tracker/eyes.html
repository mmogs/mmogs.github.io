<!DOCTYPE html>
<html>
<head>
  <title>Motion Detector (Boxes + Sound)</title>
  <style>
    body { text-align: center; background: #111; color: white; font-family: Arial; }
    canvas { position: absolute; left: 0; top: 0; }
    video { display: none; }
  </style>
</head>
<body>

<h2>Motion Detector</h2>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<audio id="boom" src="https://www.myinstants.com/media/sounds/vine-boom.mp3"></audio>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const boom = document.getElementById("boom");

let lastFrame = null;
const threshold = 30; // sensitivity

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      detectMotion();
    };
  });

function detectMotion() {
  const tempCanvas = document.createElement("canvas");
  const tempCtx = tempCanvas.getContext("2d");

  setInterval(() => {
    if (video.readyState !== 4) return;

    tempCanvas.width = video.videoWidth;
    tempCanvas.height = video.videoHeight;

    tempCtx.drawImage(video, 0, 0);

    const frame = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);

    if (!lastFrame) {
      lastFrame = frame;
      return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let motionDetected = false;

    const step = 20; // box size grid

    for (let y = 0; y < canvas.height; y += step) {
      for (let x = 0; x < canvas.width; x += step) {

        let i = (y * canvas.width + x) * 4;

        let diff =
          Math.abs(frame.data[i] - lastFrame.data[i]) +
          Math.abs(frame.data[i+1] - lastFrame.data[i+1]) +
          Math.abs(frame.data[i+2] - lastFrame.data[i+2]);

        if (diff > threshold * 3) {
          ctx.strokeStyle = "red";
          ctx.strokeRect(x, y, step, step);
          motionDetected = true;
        }
      }
    }

    if (motionDetected) {
      boom.currentTime = 0;
      boom.play();
    }

    lastFrame = frame;

  }, 100);
}
</script>

</body>
</html>
