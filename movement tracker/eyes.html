<!DOCTYPE html>
<html>
<head>
  <title>Motion Detector</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h2 {
      margin: 10px;
    }

    video {
      display: none;
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>
</head>

<body>

<h2>Motion Detector</h2>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<audio id="boom" src="bithuh-vine-boom-392646.mp3"></audio>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const boom = document.getElementById("boom");

let lastFrame = null;

// MUCH LOWER sensitivity (higher threshold = less sensitive)
const threshold = 80;

// prevents spam triggering until sound fully finishes
let audioReady = true;

// unlock audio on first interaction
document.body.addEventListener("click", () => {
  boom.play().then(() => {
    boom.pause();
    boom.currentTime = 0;
  }).catch(() => {});
});

// reset flag when sound finishes
boom.onended = () => {
  audioReady = true;
};

navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    video.srcObject = stream;

    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      startDetection();
    };
  });

function startDetection() {
  const tempCanvas = document.createElement("canvas");
  const tempCtx = tempCanvas.getContext("2d");

  setInterval(() => {
    if (video.readyState !== 4) return;

    tempCanvas.width = video.videoWidth;
    tempCanvas.height = video.videoHeight;

    tempCtx.drawImage(video, 0, 0);

    const frame = tempCtx.getImageData(
      0, 0,
      tempCanvas.width,
      tempCanvas.height
    );

    if (!lastFrame) {
      lastFrame = frame;
      return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let motionDetected = false;

    const step = 120; // larger step = less sensitive (more skipping)

    for (let y = 0; y < canvas.height; y += step) {
      for (let x = 0; x < canvas.width; x += step) {

        const i = (y * canvas.width + x) * 4;

        const diff =
          Math.abs(frame.data[i] - lastFrame.data[i]) +
          Math.abs(frame.data[i+1] - lastFrame.data[i+1]) +
          Math.abs(frame.data[i+2] - lastFrame.data[i+2]);

        if (diff > threshold * 3) {
          ctx.strokeStyle = "red";
          ctx.strokeRect(x, y, step, step);
          motionDetected = true;
        }
      }
    }

    if (motionDetected && audioReady) {
      audioReady = false; // lock until sound finishes

      boom.pause();
      boom.currentTime = 0;
      boom.play().catch(err => console.log("Audio blocked:", err));
    }

    lastFrame = frame;

  }, 120); // slightly slower loop = less sensitivity
}
</script>

</body>
</html>
