<!DOCTYPE html>
<html>
<head>
  <title>Motion Detector</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h2 { margin: 10px; }

    video { display: none; }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
    }
  </style>
</head>

<body>

<h2>Motion Detector (Blurred Heatmap + Random Sounds)</h2>

<video id="video" autoplay></video>
<canvas id="canvas"></canvas>

<!-- Sound Filez -->
<audio class="sound" src="sounds/bithuh-vine-boom-392646.mp3"></audio>
<audio class="sound" src="sounds/freesound_community-creeper-36141.mp3"></audio>
<audio class="sound" src="sounds/Rizz-sound-effect.mp3"></audio>
<audio class="sound" src="sounds/u_edtmwfwu7c-metal-pipe-329305.mp3"></audio>
<audio class="sound" src="sounds/universfield-whip-02-242215.mp3"></audio>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// offscreen canvas for heatmap
const heatCanvas = document.createElement("canvas");
const heatCtx = heatCanvas.getContext("2d");

const sounds = document.querySelectorAll(".sound");

let lastFrame = null;
let lastMotionValue = 0;

let audioReady = true;

// unlock audio
document.body.addEventListener("click", () => {
  sounds.forEach(sound => {
    sound.play().then(() => {
      sound.pause();
      sound.currentTime = 0;
    }).catch(() => {});
  });
});

// allow replay after finish
sounds.forEach(sound => {
  sound.onended = () => audioReady = true;
});

function playRandomSound() {
  const sound = sounds[Math.floor(Math.random() * sounds.length)];
  sound.currentTime = 0;
  sound.play().catch(() => {});
}

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => {
  video.srcObject = stream;

  video.onloadedmetadata = () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    heatCanvas.width = video.videoWidth;
    heatCanvas.height = video.videoHeight;

    startDetection();
  };
});

function startDetection() {
  const tempCanvas = document.createElement("canvas");
  const tempCtx = tempCanvas.getContext("2d");

  setInterval(() => {
    if (video.readyState !== 4) return;

    tempCanvas.width = video.videoWidth;
    tempCanvas.height = video.videoHeight;

    tempCtx.drawImage(video, 0, 0);

    const frame = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);

    if (!lastFrame) {
      lastFrame = frame;
      return;
    }

    // fade old heatmap (trail effect)
    heatCtx.fillStyle = "rgba(0,0,0,0.15)";
    heatCtx.fillRect(0, 0, heatCanvas.width, heatCanvas.height);

    let motionValue = 0;
    const step = 30;

    for (let y = 0; y < heatCanvas.height; y += step) {
      for (let x = 0; x < heatCanvas.width; x += step) {

        const i = (y * heatCanvas.width + x) * 4;

        const diff =
          Math.abs(frame.data[i] - lastFrame.data[i]) +
          Math.abs(frame.data[i+1] - lastFrame.data[i+1]) +
          Math.abs(frame.data[i+2] - lastFrame.data[i+2]);

        if (diff > 200) {

          const intensity = Math.min(1, diff / 600);

          let r = 0, g = 0, b = 0;

          if (intensity < 0.33) {
            g = intensity * 3 * 255;
            b = 255;
          } else if (intensity < 0.66) {
            r = (intensity - 0.33) * 3 * 255;
            g = 255;
          } else {
            r = 255;
            g = (1 - (intensity - 0.66) * 3) * 255;
          }

          heatCtx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.5)`;
          heatCtx.fillRect(x, y, step, step);

          motionValue += diff;
        }
      }
    }

    // draw blurred heatmap to main canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.filter = "blur(20px)";
    ctx.drawImage(heatCanvas, 0, 0);
    ctx.filter = "none";

    motionValue /= 1000;

    const motionSpike = motionValue - lastMotionValue;
    const fastMovementThreshold = 8;

    if (motionSpike > fastMovementThreshold && audioReady) {
      audioReady = false;
      playRandomSound();
    }

    lastMotionValue = motionValue;
    lastFrame = frame;

  }, 100);
}
</script>

</body>
</html>
